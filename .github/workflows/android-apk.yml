
name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "toobit-platform/android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build and test
        working-directory: toobit-platform/android
        run: gradle --no-daemon test assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: toobit-android-debug-apk
          path: toobit-platform/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
